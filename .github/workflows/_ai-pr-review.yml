name: Reusable AI PR Review

on:
  workflow_call:
    inputs:
      provider_name:
        description: "Display name of the reviewer (e.g. DeepSeek, GPT)"
        required: true
        type: string
      provider_id:
        description: "Lowercase identifier used for file/output naming (e.g. deepseek, gpt)"
        required: true
        type: string
      review_module:
        description: "Dotted module name of the provider's review integration (e.g. cicaid_devtools.lib.deepseek_review)"
        required: true
        type: string
      workflow_file:
        description: "Filename of the calling workflow, used in the posted comment link"
        required: true
        type: string
      deepseek_model:
        description: "DEEPSEEK_MODEL override passed to the review script, if any"
        required: false
        type: string
        default: ""
      deepseek_max_tokens:
        description: "DEEPSEEK_MAX_TOKENS override passed to the review script, if any"
        required: false
        type: string
        default: ""
      discussion_max_chars:
        description: "Max characters of PR discussion to include in the review prompt, if any (default 20000)"
        required: false
        type: string
        default: ""
    secrets:
      openai_api_key:
        description: "OpenAI API key, used for GPT reviews"
        required: false
      deepseek_api_key:
        description: "DeepSeek API key, used for DeepSeek reviews"
        required: false
      gh_token:
        description: "Token used for gh CLI calls (PR/issue read and write)"
        required: true
      cicaid_pro_token:
        description: "Fine-grained PAT (Contents: Read-only) scoped to leonarduk/cicaid-pro, used to install cicaid-devtools-pro since the review modules (review_diff, review_comment, deepseek_review, gpt_review, etc.) only exist in that private package"
        required: true

# github.workflow resolves to the *calling* workflow's name (DeepSeek/GPT PR
# Review), so this groups per-provider without cross-cancelling other
# providers' runs for the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: ${{ inputs.provider_name }} AI code review
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      pull-requests: write
      contents: read
      issues: write
      checks: write   # publish the provider-outage neutral check run (#8)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The AI-review modules this workflow imports below (review_diff,
      # review_comment, deepseek_review, gpt_review, etc.) only exist in the
      # private leonarduk/cicaid-pro package, not this public "free shell"
      # repo -- installing from here either 404s or is missing these
      # modules. pip_install_cicaid_pro.sh validates the token up front and
      # exposes the credential only to the pip process through GIT_CONFIG_*
      # variables.
      #
      # The versions come from .github/cicaid-pins.env rather than being
      # written inline here, so update-cicaid.yml can bump them without
      # pushing to .github/workflows/ (see CICAID_PINS_PATH's comment in
      # setup_review_actions.py).
      - name: Install cicaid-devtools + cicaid-devtools-pro (PR review helpers)
        env:
          CICAID_PRO_TOKEN: ${{ secrets.cicaid_pro_token }}
        run: |
          set -euo pipefail
          PINS=".github/cicaid-pins.env"
          if [ ! -f "$PINS" ]; then
            echo "::error::$PINS is missing. Run 'cicaid setup-review-actions' in this repo to restore it." >&2
            exit 1
          fi
          CICAID_REF=$(grep -oP '^CICAID_REF=\K(?:main|v[0-9][A-Za-z0-9.+-]*)(?=\r?$)' "$PINS" || true)
          if [ -z "${CICAID_REF}" ]; then
            echo "::error::no valid CICAID_REF=<tag> line in $PINS." >&2
            exit 1
          fi
          CICAID_PRO_REF=$(grep -oP '^CICAID_PRO_REF=\K(?:main|v[0-9][A-Za-z0-9.+-]*)(?=\r?$)' "$PINS" || true)
          if [ -z "${CICAID_PRO_REF}" ]; then
            echo "::error::no valid CICAID_PRO_REF=<tag> line in $PINS." >&2
            exit 1
          fi
          bash .github/scripts/pip_install_cicaid_pro.sh pip install --retries 10 \
            "cicaid-devtools @ git+https://github.com/leonarduk/cicaid.git@${CICAID_REF}" \
            "cicaid-devtools-pro @ git+https://github.com/leonarduk/cicaid-pro.git@${CICAID_PRO_REF}"

      - name: Get linked issue body
        id: issue
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
        run: |
          # Only Closes/Fixes count as the closing reference; a contextual
          # 'Refs #N' must not be picked up as the linked issue (issue #409).
          ISSUE_NUM=$(gh pr view ${{ github.event.pull_request.number }} --json body,title \
            | jq -r '[.title, .body] | join(" ")' \
            | python3 -m cicaid_devtools.lib.linked_issue || true)
          if [ -n "$ISSUE_NUM" ]; then
            ISSUE_BODY=$(gh issue view "$ISSUE_NUM" --json body -q .body 2>/dev/null || echo "Issue not found")
          else
            ISSUE_BODY="No linked issue found. Review code on its own merits."
          fi
          DELIM="EOF_$(uuidgen | tr -d '-')"
          {
            echo "body<<$DELIM"
            echo "$ISSUE_BODY"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Get PR diff
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
        run: |
          git fetch origin "$BASE_REF"
          DIFF=$(python3 -m cicaid_devtools.lib.review_diff \
            --base-ref "$BASE_REF" \
            --pr-title "$PR_TITLE" \
            --issue-body "$ISSUE_BODY")
          DELIM="EOF_$(uuidgen | tr -d '-')"
          {
            echo "diff<<$DELIM"
            echo "$DIFF"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Get PR discussion since last review
        id: discussion
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
          DISCUSSION_MAX_CHARS: ${{ inputs.discussion_max_chars }}
        run: |
          MAX_CHARS_ARGS=()
          if [ -n "$DISCUSSION_MAX_CHARS" ]; then
            MAX_CHARS_ARGS=(--max-chars "$DISCUSSION_MAX_CHARS")
          fi
          DISCUSSION=$(python3 -m cicaid_devtools.lib.review_discussion \
            --repo "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --provider-name "${{ inputs.provider_name }}" \
            "${MAX_CHARS_ARGS[@]}")
          DELIM="EOF_$(uuidgen | tr -d '-')"
          {
            echo "text<<$DELIM"
            echo "$DISCUSSION"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Extract verified symbols from diff
        id: verified
        env:
          DIFF_OUTPUT: ${{ steps.diff.outputs.diff }}
        run: |
          VERIFIED=$(python3 -m cicaid_devtools.lib.verified_symbols \
            --diff "$DIFF_OUTPUT")
          DELIM="EOF_$(uuidgen | tr -d '-')"
          {
            echo "facts<<$DELIM"
            echo "$VERIFIED"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Call ${{ inputs.provider_name }} API
        env:
          OPENAI_API_KEY: ${{ secrets.openai_api_key }}
          DEEPSEEK_API_KEY: ${{ secrets.deepseek_api_key }}
          DEEPSEEK_MODEL: ${{ inputs.deepseek_model }}
          DEEPSEEK_MAX_TOKENS: ${{ inputs.deepseek_max_tokens }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          DIFF: ${{ steps.diff.outputs.diff }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
          DISCUSSION: ${{ steps.discussion.outputs.text }}
          VERIFIED_FACTS: ${{ steps.verified.outputs.facts }}
        run: |
          python3 -m ${{ inputs.review_module }} > /tmp/${{ inputs.provider_id }}_review_body.md

          # Guard: `-s` returns true only if the file exists AND has size > 0.
          # This distinguishes a successful API response (review body written to stdout)
          # from a failure (empty output, missing file, or API error).
          if [ ! -s /tmp/${{ inputs.provider_id }}_review_body.md ]; then
            echo "ERROR: ${{ inputs.provider_name }} review output was empty" >&2
            exit 1
          fi

      - name: Check ${{ inputs.provider_name }} approval
        id: check_approval
        continue-on-error: true  # REQUEST CHANGES exits 1; allow later steps (post comment, create issues) to still run
        run: |
          set +e
          python3 -m cicaid_devtools.lib.verdict /tmp/${{ inputs.provider_id }}_review_body.md "${{ inputs.provider_name }}"
          verdict_exit=$?
          set -e

          # Exit codes from extract_verdict.py: 0 = APPROVE, 2 = provider outage
          # (soft-fail, doesn't block merge), anything else = REQUEST CHANGES /
          # missing verdict (hard fail).
          if [ "$verdict_exit" -eq 0 ]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          elif [ "$verdict_exit" -eq 2 ]; then
            echo "approved=skipped" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # A provider outage exits 0 with approved=skipped, so check_approval's
      # outcome stays "success" and the gate below does not fire. Not blocking
      # on someone else's downtime is deliberate -- but it left the required
      # check green while attesting nothing, which from the merge button is
      # indistinguishable from a real approval (#8).
      #
      # A job's conclusion can only be success or failure, so the third state
      # cannot live on this job. It is published as its own check run with
      # conclusion "neutral": visible in the PR's check list as neither a pass
      # nor a failure, and neutral does not block merging. The job itself
      # stays green, so the soft-fail intent is unchanged.
      - name: Publish ${{ inputs.provider_name }} outage as a neutral check
        if: steps.check_approval.outputs.approved == 'skipped'
        continue-on-error: true  # Reporting must never be what fails a run.
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROVIDER: ${{ inputs.provider_name }}
          PROVIDER_ID: ${{ inputs.provider_id }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SUMMARY="The provider was unreachable, so **no review was performed**. This is not an approval. Re-run [the workflow]($RUN_URL) once the provider is reachable if you want this PR reviewed before merge."

          # The distinct state the PR's check list actually shows.
          gh api -X POST "repos/$REPO/check-runs"             -f "name=$PROVIDER review: provider outage"             -f "head_sha=$HEAD_SHA"             -f "status=completed"             -f "conclusion=neutral"             -f "output[title]=No review ran - provider unreachable"             -f "output[summary]=$SUMMARY"             || echo "::warning::Could not publish the neutral check run; the annotation and PR comment still record the outage."

          echo "::warning title=$PROVIDER review did not run::Provider outage - no review was performed. Not an approval."

          {
            echo "## :warning: $PROVIDER review did not run"
            echo
            echo "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"

          # Reviewers watch the PR, not check runs or job summaries.
          {
            echo "### :warning: $PROVIDER review did not run"
            echo
            echo "$SUMMARY"
          } > "/tmp/${PROVIDER_ID}_outage.md"

          gh pr comment "$PR_NUMBER" --body-file "/tmp/${PROVIDER_ID}_outage.md"             || echo "::warning::Could not post the outage notice to PR #$PR_NUMBER; it is in the job summary."

      - name: Post ${{ inputs.provider_name }} review comment
        if: (success() || failure()) && !cancelled()
        continue-on-error: true  # If posting fails (e.g. API rate limit), don't fail job; review is also in Actions summary
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -m cicaid_devtools.lib.review_comment /tmp/${{ inputs.provider_id }}_review_body.md \
            "${{ inputs.provider_name }}" "${{ inputs.workflow_file }}" "$RUN_URL" > /tmp/${{ inputs.provider_id }}_comment_body.md

          # Write to Actions job summary so the review is always visible in the UI,
          # even if the gh pr comment call below fails.
          cat /tmp/${{ inputs.provider_id }}_comment_body.md >> "$GITHUB_STEP_SUMMARY"

          # Retry with backoff: a transient rate limit shouldn't silently drop
          # the review comment (the step summary above is a fallback, not a
          # substitute -- reviewers watching the PR don't see the summary).
          posted=false
          for delay in 0 5 10 20 40; do
            if [ "$delay" -gt 0 ]; then
              echo "gh pr comment failed, retrying in ${delay}s..." >&2
              sleep "$delay"
            fi
            if gh pr comment "$PR_NUMBER" --body-file /tmp/${{ inputs.provider_id }}_comment_body.md; then
              posted=true
              break
            fi
          done

          if [ "$posted" != true ]; then
            echo "::warning title=${{ inputs.provider_name }} review comment::Failed to post the ${{ inputs.provider_name }} review comment to PR #$PR_NUMBER after retries — check the Actions log above for the gh error (rate limit, token scope, or network)."
            echo "WARNING: failed to post review comment after retries — check the Actions log" >&2
            exit 0
          fi

      - name: Create follow-up issues
        if: steps.check_approval.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OPENAI_API_KEY: ${{ secrets.openai_api_key }}
          DEEPSEEK_API_KEY: ${{ secrets.deepseek_api_key }}
          FOLLOWUP_LLM_PROVIDER: ${{ vars.FOLLOWUP_LLM_PROVIDER }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # Fetch existing label names once and only create the ones missing,
          # instead of firing a gh label create call (and eating a 422) for
          # every label on every run.
          existing_labels="$(gh label list --json name -q '.[].name')"

          create_label_if_missing() {
            local name="$1" color="$2" description="$3"
            if ! grep -qxF "$name" <<< "$existing_labels"; then
              gh label create "$name" --color "$color" --description "$description" 2>/dev/null || true
            fi
          }

          create_label_if_missing "ai-suggested" "0075ca" "Suggested by AI code review"
          create_label_if_missing "haiku" "C5DEF5" "Suitable for Claude Haiku (simple/mechanical task)"
          create_label_if_missing "sonnet" "BFD4F2" "Suitable for Claude Sonnet (moderate reasoning)"
          create_label_if_missing "opus" "0052CC" "Suitable for Claude Opus (complex design/architecture)"

          # Extract titles to a file, then create issues via Python subprocess (no shell injection)
          python3 -m cicaid_devtools.lib.followups /tmp/${{ inputs.provider_id }}_review_body.md \
            > /tmp/followups.json
          python3 -m cicaid_devtools.lib.followup_issues \
            /tmp/followups.json "${PR_NUMBER}" /tmp/${{ inputs.provider_id }}_review_body.md

      - name: Add 'Changes Requested' label if review failed
        if: steps.check_approval.outputs.approved == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Create the label only if it doesn't already exist
          if ! gh label list --json name -q '.[].name' | grep -qxF "Changes Requested"; then
            gh label create "Changes Requested" --color "d73a49" --description "PR requested changes from code review" \
              2>/dev/null || true
          fi

          # Add the label to the PR
          gh pr edit "$PR_NUMBER" --add-label "Changes Requested"

      - name: Remove 'Changes Requested' label if review approved
        if: steps.check_approval.outputs.approved == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # gh pr edit --remove-label errors when the label is not on the PR
          # (same caveat as github_issues.remove_issue_label), so only remove
          # it when it is currently applied -- keeps the step idempotent.
          if gh pr view "$PR_NUMBER" --json labels -q '.labels[].name' | grep -qxF "Changes Requested"; then
            gh pr edit "$PR_NUMBER" --remove-label "Changes Requested"
          fi

      # Three states, decided here from `approved` rather than inferred from
      # the verdict step's outcome: true passes, false hard-fails as it always
      # has, and skipped is the outage published above as a neutral check.
      # Collapsing skipped into success is what made the gate meaningless (#8).
      - name: Fail if ${{ inputs.provider_name }} did not approve
        if: always()
        env:
          APPROVED: ${{ steps.check_approval.outputs.approved }}
          OUTCOME: ${{ steps.check_approval.outcome }}
          PROVIDER: ${{ inputs.provider_name }}
        run: |
          case "$APPROVED" in
            true)
              echo "$PROVIDER review: APPROVED."
              ;;
            skipped)
              echo "::warning::$PROVIDER review did not run (provider outage). This job is green because an outage does not block merging - see the neutral '$PROVIDER review: provider outage' check."
              ;;
            false)
              echo "::error::$PROVIDER review: CHANGES REQUESTED - address the review findings before merging."
              exit 1
              ;;
            *)
              # No verdict at all: the step never ran because something earlier
              # in the job failed. Reporting that as CHANGES REQUESTED sent
              # people looking for review findings that were never written.
              echo "::error::$PROVIDER review did not complete (verdict step outcome: $OUTCOME) - there is no review to act on. Check the earlier steps in this job."
              exit 1
              ;;
          esac
