[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-tools"
version = "0.1.0"
description = "Refuse to load an Ollama model that will not fit in attached VRAM"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# No runtime dependencies on purpose: this has to run on a fresh Ubuntu box
# and on Windows with nothing but Python installed.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "python-dotenv>=1"]  # dotenv is test-only: see tests/test_envfile.py parity test

[project.scripts]
ollama-tools = "ollama_tools.cli:main"

[tool.setuptools]
packages = ["ollama_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
